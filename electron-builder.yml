appId: 'net.imperiummc.launcher'
productName: 'Imperium Launcher'
artifactName: 'Imperium-Launcher-setup-${version}.${ext}'

copyright: 'Copyright © 2026 ImperiumMC. Based on Helios Launcher, Copyright © 2017-2026 Daniel Scalzi'

asar: true
compression: 'maximum'

files:
  - '!{dist,.gitignore,.vscode,docs,dev-app-update.yml,.nvmrc,eslint.config.mjs}'

extraResources:
  - 'libraries'

# Windows Configuration
win: 
  target: 
    - target: 'nsis'
      arch: 'x64'

# Windows Installer Configuration
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true

# macOS Configuration
mac:
  target:
    - target: 'dmg'
      arch:
        - 'x64'
        - 'arm64'
  artifactName: 'Imperium-Launcher-setup-${version}-${arch}.${ext}'
  category: 'public.app-category.games'

# Linux Configuration
linux: 
  target: 'AppImage'
  maintainer: 'ImperiumMC'
  vendor: 'ImperiumMC'
  synopsis: 'ImperiumMC Launcher'
  description: 'Official ImperiumMC launcher. Keeps the Imperium Client pack in sync and joins play.imperiummc.net.'
  category: 'Game'


directories:
  buildResources: 'build'
  output: 'dist'