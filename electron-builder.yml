appId: 'net.romanica.launcher'
productName: 'Romanica Launcher'
artifactName: 'Romanica-Launcher-setup-${version}.${ext}'

copyright: 'Copyright © 2026 Romanica. Based on Helios Launcher, Copyright © 2017-2026 Daniel Scalzi'

asar: true
compression: 'maximum'

# Update feed for electron-updater. Builds generate app-update.yml from
# this block; releases are published manually, never from a local build
# unless -p is passed explicitly.
# ROMANICA CUTOVER: repo URLs flip when the GitHub org renames
publish:
  provider: 'github'
  owner: 'Imperium-MC'
  repo: 'ImperiumLauncher'

files:
  - '!{dist,.gitignore,.vscode,docs,dev-app-update.yml,.nvmrc,eslint.config.mjs}'

extraResources:
  - 'libraries'

# Windows Configuration
win: 
  target: 
    - target: 'nsis'
      arch: 'x64'

# Windows Installer Configuration
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true

# macOS Configuration
mac:
  target:
    - target: 'dmg'
      arch:
        - 'x64'
        - 'arm64'
  artifactName: 'Romanica-Launcher-setup-${version}-${arch}.${ext}'
  category: 'public.app-category.games'

# Linux Configuration
linux: 
  target: 'AppImage'
  maintainer: 'Romanica'
  vendor: 'Romanica'
  synopsis: 'Romanica Launcher'
  # ROMANICA CUTOVER: address -> romanica.net (or play.romanica.net) when DNS is live
  description: 'Official Romanica launcher. Keeps the Imperium Client pack in sync and joins play.imperiummc.net.'
  category: 'Game'


directories:
  buildResources: 'build'
  output: 'dist'